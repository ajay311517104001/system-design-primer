# Lab 2 - Nginx Load Balancer
# =====================================================================
# Docker networking key point:
#   Containers on the same Docker network can reach each other by
#   SERVICE NAME (defined in docker-compose.yml). Docker has a built-in
#   DNS server that resolves "server_a" → that container's IP.
#   No IPs to hardcode, no host.docker.internal needed.
#
# Traffic flow:
#   Postman → localhost:5000 → nginx container:80
#             → round-robin → server_a:5000
#                          or server_b:5000
#                          or server_c:5000
# =====================================================================

events {
    worker_connections 1024;
}

http {

    upstream linktrack_pool {
        # Round-Robin (default) — requests cycle through A → B → C → A ...
        server server_a:5000;
        server server_b:5000;
        server server_c:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass        http://linktrack_pool;

            # Forward real client IP so app logs show who called
            proxy_set_header  X-Real-IP       $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header  Host            $host;

            # If one server crashes mid-request, retry on the next one
            proxy_next_upstream error timeout;
        }
    }
}
